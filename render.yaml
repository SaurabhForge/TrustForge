# TrustForge Render Infrastructure-as-Code Blueprint
# Deploy via Render Dashboard -> Blueprints -> New Blueprint Instance
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: trustforge-db
    databaseName: trustforge
    user: trustforge
    plan: free

services:
  # ─── 1. Backend REST API Service ───────────────────────────────────────────
  - type: web
    name: trustforge-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: trustforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CORS_ORIGIN
        value: "*"
      - key: RPC_URL
        value: https://rpc.ankr.com/eth_sepolia
      - key: CHAIN_ID
        value: 11155111
      - key: TRUSTFORGE_IDENTITY_REGISTRY_ADDRESS
        value: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      - key: TRUSTFORGE_ACCESS_CONTROL_ADDRESS
        value: 0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - key: TRUSTFORGE_ASSET_REGISTRY_ADDRESS
        value: 0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0

  # ─── 2. Frontend React SPA Static Site ─────────────────────────────────────
  - type: web
    name: trustforge-frontend
    runtime: static
    rootDir: trustforge
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to your trustforge-backend onrender URL (e.g. https://trustforge-backend.onrender.com)
      - key: VITE_API_URL
        sync: false
